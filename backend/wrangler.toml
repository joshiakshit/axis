name = "axis-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Create with wrangler kv namespace create CONFIG, then set the returned ID.
[[kv_namespaces]]
binding = "CONFIG"
id = "b200a28fe55042828366f54754224ef6"

# Create with wrangler d1 create axis, then set the returned database ID.
# Apply schema changes with wrangler d1 migrations apply axis --remote.
[[d1_databases]]
binding = "DB"
database_name = "axis"
database_id = "d53d64f6-43c2-4e63-8b12-66ea3759c35d"

# Serves the release APK at GET /v1/apk.
[[r2_buckets]]
binding = "APK"
bucket_name = "axis-apk"

[vars]
DEFAULT_APP_VERSION = "3.0.9"
DEFAULT_TENANT = "gu"
# "true" enables auto-approval for new users.
OPEN_ENROLLMENT = "false"

# Set secrets with wrangler secret put <NAME>:
#   ADMIN_TOKEN        required to write config
#   DEFAULT_AUTH_TOKEN optional seed for the iCloudEMS bearer before first write
#   APP_ACCESS_KEY     optional soft gate for GET /v1/config
#   SESSION_SECRET     required: signs Axis session tokens (openssl rand -hex 32)
#   ADMIN_ADMNOS       comma-separated owner admno(s) that get admin + auto-approval
#   ADMIN_APP_TOKEN    personal credential for the separate Axis Admin app

[observability]
enabled = true
